<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="format-detection" content="telephone=no" />
    <title>Rankify</title>
    <meta name="description" content="Rankify is a production-grade educational platform for CBSE students featuring personalized study paths, adaptive practice, and comprehensive syllabus tracking." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rankify" />
    <meta property="og:description" content="Rankify is a production-grade educational platform for CBSE students featuring personalized study paths, adaptive practice, and comprehensive syllabus tracking." />
    <meta property="og:image" content="/icon-512.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rankify" />
    <meta name="twitter:description" content="Rankify is a production-grade educational platform for CBSE students featuring personalized study paths, adaptive practice, and comprehensive syllabus tracking." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#191c24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rankify" />
    
    <!-- Icons & Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased selection:bg-purple-500/20 selection:text-purple-600">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
