<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="capGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Rectangle (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#appleGradient)" filter="url(#softGlow)" />
  
  <!-- Subtle glass inner highlight -->
  <rect x="28" y="28" width="456" height="232" rx="112" fill="white" fill-opacity="0.12" />

  <!-- Educational Emblem: Graduation Cap + Rank Star -->
  <g transform="translate(100, 110)">
    <!-- Academic Cap Diamond -->
    <path d="M156 46 L290 106 L156 166 L22 106 Z" fill="url(#capGlow)" />
    <!-- Cap Under Skullcap -->
    <path d="M68 128 L68 182 C68 226, 244 226, 244 182 L244 128 C216 148, 96 148, 68 128 Z" fill="#ffffff" fill-opacity="0.92" />
    <!-- Tassel Ribbon & Bead -->
    <path d="M256 122 L276 186 C278 198, 270 210, 260 212 C250 214, 242 206, 244 194 L250 148" stroke="#facc15" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="258" cy="208" r="8" fill="#facc15" />
    
    <!-- Rankify Star of Excellence -->
    <path d="M156 240 L166 264 L192 266 L172 284 L178 308 L156 294 L134 308 L140 284 L120 266 L146 264 Z" fill="#facc15" />
  </g>
</svg>
